# Local development dependencies only. The app itself runs on the host
# (uv run fastapi dev) so reloads stay fast.
services:
  postgres:
    image: postgres:16-alpine
    container_name: lct-postgres
    environment:
      POSTGRES_USER: lct
      POSTGRES_PASSWORD: lct
      POSTGRES_DB: lct
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lct"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: lct-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Audio archive for per-utterance clips (Phase 5). S3-compatible.
  minio:
    image: minio/minio:latest
    container_name: lct-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lct
      MINIO_ROOT_PASSWORD: lctsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
